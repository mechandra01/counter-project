<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="box">
        <h1>Counter Web</h1>
        <p>Asimple counting experience</p>
        <div class="box-container">
            <div class="box1">
                <h3>CURRENT COUNT</h3>
                <h1 class="start">0</h1>
                <h5 class="box2">Zero state</h5>
            </div>
        </div>
        <div class="box3">
        <div class="decrease">
            <button class="btn">-</button>
            <h4>Decrease</h4>
        </div>
        <div class="increase">
            <button class="btn">+</button>
            <h4>Increase</h4>
        </div>
        </div>
        <div class="box12">
            <div class="box4">
                <button class="btn-1">⚙️</button>
                <h3>Reset Counter</h3>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
